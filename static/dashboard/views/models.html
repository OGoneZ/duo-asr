<section class="view view-models" data-view="models">
      <header class="view-header">
        <div class="view-title">
          <h1>模型管理<span class="view-eyebrow">Models</span></h1>
        </div>
        <span class="muted" id="models-meta"></span>
      </header>

      <div id="models-error" class="hotwords-error" hidden></div>

      <div class="model-task-card" id="model-task-card" hidden>
        <div class="model-task-head">
          <span class="model-task-id" id="model-task-name"></span>
          <span class="model-task-state" id="model-task-state"></span>
        </div>
        <div class="model-task-progress">
          <div class="model-task-bar"><span id="model-task-bar-fill"></span></div>
          <span class="model-task-pct" id="model-task-pct">0%</span>
        </div>
        <div class="model-task-meta" id="model-task-meta"></div>
      </div>

      <h2 class="models-section-title">已下载</h2>
      <ul class="models-list" id="models-list"></ul>

      <h2 class="models-section-title">推荐模型</h2>
      <ul class="models-list models-recommended" id="models-recommended"></ul>

      <h2 class="models-section-title">搜索 ModelScope</h2>
      <div class="model-search-panel">
        <div class="model-search-row">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.35-4.35"/>
          </svg>
          <input type="search" id="model-search-input"
                 placeholder="搜索 ModelScope 上的模型，如 paraformer、whisper、qwen…"
                 autocomplete="off" spellcheck="false">
          <button class="search-clear" id="model-search-clear" type="button" aria-label="清空" hidden>×</button>
        </div>
        <p class="model-search-hint">
          搜索结果可能包含非 ASR 模型；标 <span class="model-badge model-badge-asr">ASR</span>
          的可直接加载，其他类型仅供参考。直接输入完整 ID（如 <code>iic/SenseVoiceLarge</code>）也可命中精确匹配。
        </p>
        <div id="model-search-status" class="model-search-status" hidden></div>
        <ul id="model-search-results" class="model-search-results"></ul>
      </div>

      <!-- 兼容性兜底：仍保留隐藏的 input/button 让 setupModelsPage 不报错 -->
      <input type="hidden" id="model-download-id">
      <button id="model-download-btn" type="button" hidden></button>
</section>
