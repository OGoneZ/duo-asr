<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASR Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">ASR Panel</div>
    <nav>
      <a href="#/" class="nav-item" data-view="home">
        <span class="nav-icon">▮</span> 首页
      </a>
      <a href="#/history" class="nav-item" data-view="history">
        <span class="nav-icon">▤</span> 历史记录
      </a>
    </nav>
    <div class="sidebar-foot" id="last-update"></div>
  </aside>

  <main class="content">
    <!-- 首页 -->
    <section class="view view-home" data-view="home">
      <header class="view-header">
        <h1>概览</h1>
        <div class="toolbar">
          <div class="dropdown" id="client-dropdown">
            <button class="dropdown-toggle" id="client-toggle">
              <span id="client-toggle-label">全部</span>
              <span class="dropdown-caret">▾</span>
            </button>
            <ul class="dropdown-menu" id="client-menu" hidden></ul>
          </div>
          <div class="segmented" id="period-switch">
            <button data-days="7">7 天</button>
            <button data-days="30" class="active">30 天</button>
            <button data-days="90">90 天</button>
          </div>
        </div>
      </header>

      <div class="cards">
        <div class="card">
          <div class="card-label">累计转录</div>
          <div class="card-value">
            <span id="stat-chars">—</span><span class="card-unit">字</span>
          </div>
        </div>
        <div class="card">
          <div class="card-label">累计节省键盘敲击</div>
          <div class="card-value">
            <span id="stat-keystrokes">—</span><span class="card-unit">次</span>
          </div>
        </div>
        <div class="card">
          <div class="card-label">累计转录时长</div>
          <div class="card-value">
            <span id="stat-duration">—</span><span class="card-unit" id="stat-duration-unit"></span>
          </div>
        </div>
        <div class="card">
          <div class="card-label">平均语速</div>
          <div class="card-value">
            <span id="stat-cpm">—</span><span class="card-unit">字/分</span>
          </div>
        </div>
        <div class="card">
          <div class="card-label">平均语音时长</div>
          <div class="card-value">
            <span id="stat-avg-dur">—</span><span class="card-unit">s</span>
          </div>
        </div>
        <div class="card">
          <div class="card-label">平均推理耗时</div>
          <div class="card-value">
            <span id="stat-inference">—</span><span class="card-unit">s</span>
          </div>
        </div>
      </div>

      <div class="chart-section">
        <h2>每日趋势</h2>
        <span class="muted" id="chart-subtitle">字数与说话时长</span>
        <div class="chart-wrap"><canvas id="daily-chart"></canvas></div>
      </div>
    </section>

    <!-- 历史记录页 -->
    <section class="view view-history" data-view="history" hidden>
      <header class="view-header">
        <h1>历史记录</h1>
        <span class="muted" id="history-count"></span>
      </header>
      <ul class="recent-list" id="recent-list"></ul>
      <div class="load-more">
        <button id="load-more-btn">加载更多</button>
      </div>
    </section>
  </main>

  <script src="vendor/chart.umd.js"></script>
  <script src="app.js"></script>
</body>
</html>
