<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DuoASR · 数据面板</title>
  <link rel="stylesheet" href="style/base.css">
  <link rel="stylesheet" href="style/components.css">
  <link rel="stylesheet" href="style/home.css">
  <link rel="stylesheet" href="style/history.css">
  <link rel="stylesheet" href="style/hotwords.css">
  <link rel="stylesheet" href="style/transcribe.css">
  <link rel="stylesheet" href="style/models.css">
</head>
<body>
  <!-- 极光背景 + 双层纹理（细颗粒噪点 + 粗纤维纸纹） -->
  <div class="aurora" aria-hidden="true">
    <span class="aurora-blob aurora-blob-1"></span>
    <span class="aurora-blob aurora-blob-2"></span>
    <span class="aurora-blob aurora-blob-3"></span>
  </div>
  <div class="noise" aria-hidden="true"></div>
  <div class="paper-grain" aria-hidden="true"></div>

  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v18"/>
          <path d="M8 7v10"/>
          <path d="M16 7v10"/>
          <path d="M4 11v2"/>
          <path d="M20 11v2"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-title">DuoASR</span>
        <span class="brand-sub">数据面板</span>
      </span>
    </div>

    <nav>
      <a href="#/" class="nav-item" data-view="home">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12l9-9 9 9"/>
            <path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/>
          </svg>
        </span>
        <span>首页</span>
      </a>
      <a href="#/history" class="nav-item" data-view="history">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 7v5l3 2"/>
            <path d="M3 12a9 9 0 0 1 4.5-7.79"/>
          </svg>
        </span>
        <span>历史记录</span>
      </a>
      <a href="#/transcribe" class="nav-item" data-view="transcribe">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <path d="M12 19v3"/>
            <path d="M8 22h8"/>
          </svg>
        </span>
        <span>在线转录</span>
      </a>
      <a href="#/hotwords" class="nav-item" data-view="hotwords">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16v4H4z"/>
            <path d="M4 12h10v4H4z"/>
            <path d="M4 20h7"/>
            <path d="m17 14 3 3-3 3"/>
          </svg>
        </span>
        <span>热词管理</span>
      </a>
      <a href="#/models" class="nav-item" data-view="models">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="6" width="18" height="4" rx="1"/>
            <rect x="3" y="14" width="18" height="4" rx="1"/>
            <circle cx="7" cy="8" r="0.6" fill="currentColor"/>
            <circle cx="7" cy="16" r="0.6" fill="currentColor"/>
          </svg>
        </span>
        <span>模型管理</span>
      </a>
    </nav>

    <div class="sidebar-foot">
      <span class="pulse-dot" aria-hidden="true"></span>
      <span id="last-update">实时同步中</span>
    </div>
  </aside>

  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换主题">
    <svg class="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
    <svg class="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
  </button>

  <main class="content" id="main-content">
    <!-- view fragment 由 main.js 在路由切换时 fetch 注入 -->
  </main>

  <!-- 通用确认弹窗（全局，常驻） -->
  <dialog class="confirm-dialog" id="confirm-dialog">
    <div class="confirm-card">
      <div class="confirm-title" id="confirm-title">确认操作</div>
      <div class="confirm-message" id="confirm-message"></div>
      <div class="confirm-actions">
        <button class="confirm-btn confirm-btn-cancel" id="confirm-cancel" type="button">取消</button>
        <button class="confirm-btn confirm-btn-ok" id="confirm-ok" type="button">确认</button>
      </div>
    </div>
  </dialog>

  <script src="vendor/chart.umd.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
